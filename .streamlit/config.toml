# Committed Streamlit config (no secrets). Secrets go in .streamlit/secrets.toml
# (gitignored) locally, or the Streamlit Community Cloud "Secrets" UI in deploy.
[server]
headless = true
enableCORS = false

[browser]
gatherUsageStats = false

# "declassified terminal" - near-black ground, bone text, oxidised-stamp accent,
# monospace throughout. Full component styling is in dashboard/ui.py (inject_css).
[theme]
base = "dark"
primaryColor = "#C8402F"
backgroundColor = "#0C0C0C"
secondaryBackgroundColor = "#141414"
textColor = "#E4E1D8"
font = "monospace"
