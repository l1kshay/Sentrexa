# Sentrexa BigQuery sync (Phase 7).
# Reads changed alert / incident / log-volume data from PostgreSQL and MERGEs it
# into the BigQuery star schema. Runs after the main pipeline on a schedule.
#
# Authentication is keyless: Workload Identity Federation. google-github-actions/auth
# exchanges the job's OIDC token for short-lived credentials that impersonate
# sentrexa-bq-sync - no service-account key file anywhere.
name: bigquery_sync

on:
  schedule:
    - cron: "47 */6 * * *"     # ~30 min after the pipeline workflow
  workflow_dispatch:

concurrency:
  group: sentrexa-bigquery-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write               # REQUIRED so the job can mint an OIDC token for WIF

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SENTREXA_ENV: ci
      DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BIGQUERY_DATASET: analytics
      BIGQUERY_LOCATION: US
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SYNC_SA }}

      - name: Ensure BigQuery schema
        run: python -m bi_export.schema.bigquery_schema

      - name: Sync PostgreSQL -> BigQuery
        run: python -m bi_export.sync_to_bigquery
